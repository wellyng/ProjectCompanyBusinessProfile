<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - BebekCarok</title>

    <link rel="stylesheet" href="../style.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            min-height:100vh;

            background-image:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1200&auto=format&fit=crop');

            background-size:cover;

            background-position:center;
        }

        .overlay{

            min-height:100vh;

            background:rgba(0,0,0,0.6);

            padding:40px;
        }

        .history-container{

            max-width:1200px;

            margin:auto;

            background:rgba(255,255,255,0.15);

            backdrop-filter:blur(15px);

            border-radius:20px;

            padding:30px;

            color:white;
        }

        h1{

            text-align:center;

            margin-bottom:30px;
        }

        table{

            width:100%;

            border-collapse:collapse;
        }

        table th,
        table td{

            border:1px solid rgba(255,255,255,0.3);

            padding:15px;

            text-align:center;
        }

        table th{

            background:rgba(255,255,255,0.2);
        }

        .status-paid{

            color:#7CFC00;

            font-weight:bold;
        }

        .status-pending{

            color:#FFD700;

            font-weight:bold;
        }

        .status-delivered{

            color:#00FFFF;

            font-weight:bold;
        }

        .back-btn{

            display:block;

            text-align:center;

            margin-top:25px;

            color:white;

            text-decoration:none;
        }

    </style>

</head>

<body>

    <div class="overlay">

        <div class="history-container">

            <h1>Order History</h1>

            <table>

                <thead>

                    <tr>

                        <th>Order ID</th>

                        <th>Order Date</th>

                        <th>Total Price</th>

                        <th>Payment Status</th>

                        <th>Delivery Status</th>

                    </tr>

                </thead>

                <tbody id="orderHistoryTable">

                    <tr>

                        <td>1</td>

                        <td>31 May 2026</td>

                        <td>Rp 13.000</td>

                        <td class="status-paid">
                            Paid
                        </td>

                        <td class="status-delivered">
                            Delivered
                        </td>

                    </tr>

                    <tr>

                        <td>2</td>

                        <td>1 June 2026</td>

                        <td>Rp 24.100</td>

                        <td class="status-pending">
                            Pending
                        </td>

                        <td>
                            Preparing
                        </td>

                    </tr>

                </tbody>

            </table>

            <a
                href="../index2.html"
                class="back-btn"
            >
                ← Back To Home
            </a>

        </div>

    </div>

</body>
</html>
