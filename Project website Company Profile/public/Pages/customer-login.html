<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - BebekCarok</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background-image:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1200&auto=format&fit=crop');

            background-size:cover;
            background-position:center;
        }

        .login-box{

            width:400px;

            background:rgba(0,0,0,0.7);

            padding:40px;

            border-radius:15px;

            color:white;

            backdrop-filter:blur(5px);

        }

        h1{

            text-align:center;

            margin-bottom:25px;

        }

        input{

            width:100%;

            padding:12px;

            margin-bottom:15px;

            border:none;

            border-radius:8px;

        }

        button{

            width:100%;

            padding:12px;

            border:none;

            border-radius:8px;

            cursor:pointer;

            font-size:16px;

        }

        .home-btn{

            display:block;

            width:100%;

            padding:12px;

            margin-top:15px;

            background:white;

            color:black;

            text-align:center;

            text-decoration:none;

            border-radius:8px;

            font-size:16px;
        }


        button:hover{

            opacity:0.9;

        }

    </style>

</head>
<body>

    <div class="login-box">

        <h1>Customer Login</h1>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button type="submit">
                Login
            </button>
            <a href="/" class="home-btn">
                ← Back To Home
            </a>

        </form>

    </div>

    <script>

document.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    try{

        const response =
            await fetch("/customer-login",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    email: email,
                    password: password

                })

            });

        const result =
            await response.text();

        console.log(result);

        if(result === "success"){

            alert("Login berhasil");

            localStorage.setItem(
                'isLogin',
                'true'
            );

            window.location.href =
                "/";

        }
        else{

            alert("Email atau Password salah");

        }

    }
    catch(err){

        console.log(err);

        alert("Server Error");

    }

});

</script>

</body>
</html>
