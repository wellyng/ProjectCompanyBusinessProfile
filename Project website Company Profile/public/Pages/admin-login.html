<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - BebekCarok</title>

    <link rel="stylesheet" href="../style.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background-image:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1200&auto=format&fit=crop');
            background-size:cover;
            background-position:center;
        }

        .overlay{
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
        }

        .login-container{

            position:relative;
            z-index:2;

            width:400px;

            padding:40px;

            border-radius:20px;

            backdrop-filter:blur(15px);

            background:rgba(255,255,255,0.15);

            box-shadow:0 8px 32px rgba(0,0,0,0.3);

            color:white;
        }

        .logo{

            text-align:center;

            font-size:32px;

            font-weight:bold;

            margin-bottom:10px;
        }

        .subtitle{

            text-align:center;

            margin-bottom:30px;

            color:#ddd;
        }

        .input-group{

            margin-bottom:20px;
        }

        .input-group label{

            display:block;

            margin-bottom:8px;
        }

        .input-group input{

            width:100%;

            padding:12px;

            border:none;

            border-radius:10px;

            outline:none;
        }

        .login-btn{

            width:100%;

            padding:12px;

            border:none;

            border-radius:10px;

            cursor:pointer;

            font-size:16px;

            font-weight:bold;

            background:white;

            color:black;

            transition:0.3s;
        }

        .login-btn:hover{

            transform:scale(1.03);
        }

        .back-link{

            display:block;

            text-align:center;

            margin-top:20px;

            color:white;

            text-decoration:none;
        }

        .back-link:hover{

            text-decoration:underline;
        }

    </style>

</head>
<body>

    <div class="overlay"></div>

    <div class="login-container">

        <div class="logo">
            BebekCarok
        </div>

        <p class="subtitle">
            Admin Login Panel
        </p>

        <form id="adminForm">

            <div class="input-group">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    required
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>

        </form>

        <a
            href="../index2.html"
            class="back-link"
        >
            ← Back To Home
        </a>

    </div>

    <script>
        console.log("SCRIPT JALAN");

        document.getElementById('adminForm')
        .addEventListener('submit', async function(e){
            console.log("TOMBOL LOGIN DIKLIK")

            e.preventDefault();

            const username =
                document.querySelector('input[name="username"]').value;

            const password =
                document.querySelector('input[name="password"]').value;

            const response = await fetch('/admin-login', {

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    username,
                    password
                })

            });

            const result = await response.text();

            if(result === 'success'){

                alert('Login Berhasil');

                window.location.href =
                    '/Pages/admin.html';

            }else{

                alert('Username atau Password Salah');

            }

        });

</script>

</body>
</html>
